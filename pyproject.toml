[project]
name = "gei"
version = "0.0.0"
description = "Global Equity Intelligence (GEI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps"]
addopts = "--strict-markers --strict-config"
markers = ["integration: needs a real PostgreSQL 16 (GEI_DATABASE_URL)"]

[tool.coverage.run]
source = ["packages", "apps"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages", "apps"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["domain.*", "application.*", "data_engine.*"]
strict = true
