default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: guard-main-push
        name: refuse direct push to main
        entry: scripts/guard_main_push.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: make-ci
        name: make ci (lint, typecheck, unit tests)
        entry: make ci
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
